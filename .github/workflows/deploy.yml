name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Configure AWS credentials for Terraform backend
        uses: aws-actions/configure-aws-credentials@v2.5.3
        with:
          aws-access-key-id: ${{ secrets.AWS_STATE_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_STATE_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Terraform init
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Initialize Terraform
        working-directory: infra
        run: terraform init -input=false

      - name: Read Terraform outputs
        working-directory: infra
        id: tf_outputs
        run: |
          WEBSITE_BUCKET=$(terraform output -raw website_bucket_name)
          CLOUDFRONT_DISTRIBUTION_ID=$(terraform output -raw cloudfront_distribution_id)
          echo "WEBSITE_BUCKET=${WEBSITE_BUCKET}" >> "$GITHUB_OUTPUT"
          echo "CLOUDFRONT_DISTRIBUTION_ID=${CLOUDFRONT_DISTRIBUTION_ID}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials for deployment
        uses: aws-actions/configure-aws-credentials@v2.5.3
        with:
          aws-access-key-id: ${{ secrets.AWS_DEPLOY_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_DEPLOY_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Deploy build to S3
        run: aws s3 sync dist/ "s3://${WEBSITE_BUCKET}" --delete
        env:
          WEBSITE_BUCKET: ${{ steps.tf_outputs.outputs.WEBSITE_BUCKET }}

      - name: Create CloudFront invalidation
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ steps.tf_outputs.outputs.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" --paths "/*"
