name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate required role configuration
        env:
          AWS_STATE_ROLE_ARN: ${{ secrets.AWS_STATE_ROLE_ARN }}
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$AWS_STATE_ROLE_ARN" ]; then
            echo "Missing secret: AWS_STATE_ROLE_ARN"
            exit 1
          fi

          if [ -z "$AWS_DEPLOY_ROLE_ARN" ]; then
            echo "Missing secret: AWS_DEPLOY_ROLE_ARN"
            exit 1
          fi

      - name: Validate role ARN formats and target accounts
        env:
          AWS_STATE_ROLE_ARN: ${{ secrets.AWS_STATE_ROLE_ARN }}
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          STATE_ACCOUNT_ID=$(echo "$AWS_STATE_ROLE_ARN" | sed -E 's#^arn:aws:iam::([0-9]{12}):role/.+#\1#')
          DEPLOY_ACCOUNT_ID=$(echo "$AWS_DEPLOY_ROLE_ARN" | sed -E 's#^arn:aws:iam::([0-9]{12}):role/.+#\1#')

          if [ "$STATE_ACCOUNT_ID" = "$AWS_STATE_ROLE_ARN" ] || [ -z "$STATE_ACCOUNT_ID" ]; then
            echo "AWS_STATE_ROLE_ARN is not a valid IAM role ARN"
            exit 1
          fi

          if [ "$DEPLOY_ACCOUNT_ID" = "$AWS_DEPLOY_ROLE_ARN" ] || [ -z "$DEPLOY_ACCOUNT_ID" ]; then
            echo "AWS_DEPLOY_ROLE_ARN is not a valid IAM role ARN"
            exit 1
          fi

          if [ "$STATE_ACCOUNT_ID" != "311141538914" ]; then
            echo "AWS_STATE_ROLE_ARN must target sec account 311141538914, got ${STATE_ACCOUNT_ID}"
            exit 1
          fi

          if [ "$DEPLOY_ACCOUNT_ID" != "565393049153" ]; then
            echo "AWS_DEPLOY_ROLE_ARN must target prod account 565393049153, got ${DEPLOY_ACCOUNT_ID}"
            exit 1
          fi

          echo "Role ARNs validated for sec/prod accounts."

      - name: Configure AWS credentials for Terraform backend
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          role-to-assume: ${{ secrets.AWS_STATE_ROLE_ARN }}
          role-session-name: gha-terraform-backend
          aws-region: eu-north-1
          audience: sts.amazonaws.com

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0
          terraform_wrapper: false

      - name: Initialize Terraform
        working-directory: infra
        run: terraform init -input=false

      - name: Read Terraform outputs
        working-directory: infra
        id: tf_outputs
        run: |
          WEBSITE_BUCKET=$(terraform output -raw website_bucket_name)
          CLOUDFRONT_DISTRIBUTION_ID=$(terraform output -raw cloudfront_distribution_id)
          DDB_TABLE=$(terraform output -raw dynamodb_table_name)
          COGNITO_AUTHORITY=$(terraform output -raw cognito_authority)
          COGNITO_CLIENT_ID=$(terraform output -raw cognito_user_pool_client_id)
          COGNITO_HOSTED_UI=$(terraform output -raw cognito_hosted_ui_domain)
          {
            echo "WEBSITE_BUCKET=${WEBSITE_BUCKET}"
            echo "CLOUDFRONT_DISTRIBUTION_ID=${CLOUDFRONT_DISTRIBUTION_ID}"
            echo "DDB_TABLE=${DDB_TABLE}"
            echo "COGNITO_AUTHORITY=${COGNITO_AUTHORITY}"
            echo "COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID}"
            echo "COGNITO_HOSTED_UI=${COGNITO_HOSTED_UI}"
          } >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials for deployment
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-deploy
          aws-region: eu-north-1
          audience: sts.amazonaws.com

      - name: Install dependencies
        run: npm ci

      - name: Export DynamoDB snapshot
        run: npm run export:data
        env:
          AWS_REGION: eu-north-1
          DDB_TABLE: ${{ steps.tf_outputs.outputs.DDB_TABLE }}

      - name: Build production bundle
        run: npm run build
        env:
          VITE_COGNITO_AUTHORITY: ${{ steps.tf_outputs.outputs.COGNITO_AUTHORITY }}
          VITE_COGNITO_CLIENT_ID: ${{ steps.tf_outputs.outputs.COGNITO_CLIENT_ID }}
          VITE_COGNITO_HOSTED_UI: ${{ steps.tf_outputs.outputs.COGNITO_HOSTED_UI }}

      - name: Deploy build to S3
        run: aws s3 sync dist/ "s3://${WEBSITE_BUCKET}" --delete
        env:
          WEBSITE_BUCKET: ${{ steps.tf_outputs.outputs.WEBSITE_BUCKET }}

      - name: Create CloudFront invalidation
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ steps.tf_outputs.outputs.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" --paths "/*"

      - name: Reminder for infrastructure changes
        run: |
          echo "Reminder: infrastructure code changes in infra/ are not auto-applied by this pipeline."
          echo "Run terraform plan and terraform apply manually when infra changes are needed."
